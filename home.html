<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- tailwind and daisyui cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome cdn  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-[#f4f5f7] h-[100vh] max-w-lg m-auto px-3">
    <!-- navbar section  -->
    <div
      class="flex justify-between max-w-lg m-auto border-b-1 border-gray-400"
    >
      <div class="flex">
        <div>
          <img class="w-12" src="./assets/Group.png" alt="" />
        </div>
        <div>
          <h2 class="font-bold">$<span id="Available-balance">45000</span></h2>
          <p class="text-gray-600">Available Balance</p>
        </div>
      </div>

      <div>
        <button class="btn rounded-md text-gray-600">
          <i
            class="fa-solid fa-arrow-right-from-bracket text-gray-500 rotate-180"
          ></i>
          Log Out
        </button>
      </div>
    </div>

    <!-- title / heading -->
    <div>
      <h2 class="font-bold text-2xl mt-11">🔥 Welcome to Payooo!</h2>
      <p class="text-gray-500 p-2">
        Enjoy easy and convenient financial services with us. Cashout charge is
        low and
      </p>
    </div>

    <!-- card section start here  -->
    <div class="min-h-[300px] gap-3 mx-2 grid grid-cols-3 mt-7">
      <div
        id="add-button"
        class="rounded-3xl border-1 border-gray-300 flex flex-col justify-center items-center bg-white"
      >
        <img class="" src="./assets/money1.png" alt="" />
        <h4 class="font-semibold">Add Money</h4>
      </div>
      <div
        id="cash-out-button"
        class="rounded-3xl border-1 border-gray-300 flex flex-col justify-center items-center bg-white"
      >
        <img class="" src="./assets/money1.png" alt="" />
        <h4 class="font-semibold">Cashout</h4>
      </div>
      <div
        id="transfer-button"
        class="rounded-3xl border-1 border-gray-300 flex flex-col justify-center items-center bg-white"
      >
        <img class="" src="./assets/money1.png" alt="" />
        <h4 class="font-semibold">Transfer Money</h4>
      </div>
      <div
      id="bonus-button"
        class="rounded-3xl border-1 border-gray-300 flex flex-col justify-center items-center bg-white"
      >
        <img class="" src="./assets/money1.png" alt="" />
        <h4 class="font-semibold">Get Bonus</h4>
      </div>
      <div
      id="bill-button"
        class="rounded-3xl border-1 border-gray-300 flex flex-col justify-center items-center bg-white"
      >
        <img class="" src="./assets/money1.png" alt="" />
        <h4 class="font-semibold">Pay Bill</h4>
      </div>
      <div
      id="transactions-button"
        class="rounded-3xl border-1 border-gray-300 flex flex-col justify-center items-center bg-white"
      >
        <img src="./assets/money1.png" alt="" />
        <h4 class="font-semibold">Transactions</h4>
      </div>
    </div>

    <div class="all-form-sections max-w-lg mx-auto">
      <!-- add money section  -->
      <div class="form" id="add-money-parent" style="display: none">
        <h3 class="mt-10 text-xl font-bold mb-3">Add Money</h3>
        <form class="bg-white px-5">
          <div class="flex flex-col">
            <label class="my-3 font-semibold">Select A Bank</label>
            <select class="select w-[80%]" id="bank">
              <option>City bank</option>
              <option>AB Bank</option>
              <option>Islamic bank</option>
              <option>CD Bank</option>
            </select>
          </div>

          <div class="mt-3">
            <label class="font-semibold">Bank Account Number</label>
            <input
              id="account-number"
              type="text"
              placeholder="Enter 11 digit account number"
              class="bg-white rounded-lg p-2 w-[80%] my-3"
            />
          </div>
          <div class="mt-3">
            <label class="font-semibold">Amount to Add</label>
            <input
              id="add-amount"
              type="text"
              placeholder="Add Amount to withdraw"
              class="bg-white rounded-lg p-2 w-[80%] my-3"
            />
          </div>
          <div class="mt-3">
            <label class="font-semibold">Pin Number</label>
            <input
              id="pin-number"
              type="text"
              placeholder="Enter 4 digit pin number"
              class="bg-white rounded-lg p-2 w-[80%] my-3"
            />
          </div>
          <button
            id="add-money-btn"
            class="btn bg-[#0874F2] w-[80%] text-white rounded-full"
          >
            Add Money
          </button>
        </form>
      </div>

      <!-- cash out section -->
      <div class="form" id="cash-out-parent" style="display: none">
        <h3 class="mt-10 text-xl font-bold mb-3">Cash Out</h3>
        <form class="bg-white px-5">
          <div class="mt-3">
            <label class="font-semibold">Agent Number</label>
            <input
              id="account-number"
              type="text"
              placeholder="Enter 11 digit number"
              class="bg-white rounded-lg p-2 w-[80%] my-3"
            />
          </div>
          <div class="mt-3">
            <label class="font-semibold">Amount</label>
            <br /><input
              id="withdraw-amount"
              type="text"
              placeholder="Enter Amount to withdraw"
              class="bg-white rounded-lg p-2 w-[80%] my-3"
            />
          </div>
          <div class="mt-3">
            <label class="font-semibold">Pin Number</label>
            <input
              id="pin-number"
              type="text"
              placeholder="Enter 4 digit pin number"
              class="bg-white rounded-lg p-2 w-[80%] my-3"
            />
          </div>
          <button
            id="withdraw-btn"
            class="btn bg-[#0874F2] w-[80%] text-white rounded-full"
          >
            withdraw Money
          </button>
        </form>
      </div>
    </div>

    <!-- transfer money section -->
    <div class="form" id="transfer-money-parent" style="display: none">
      <h1 class="my-5 font-bold">Transfer Money</h1>
    </div>

    <!-- get bonus section -->
    <div class="form" id="bonus-parent" style="display: none">
      <h1 class="my-5 font-bold">Get Bonus</h1>
    </div>
    <!-- pay bill section -->
    <div class="form" id="pay-bill-parent" style="display: none">
      <h1 class="my-5 font-bold">Pay Bill</h1>
    </div>
    <!-- transactions section -->
    <div class="form" id="transactions-parent" style="display: none">
      <h1 class="my-5 font-bold">Transactions</h1>
    </div>

    <script src="./home.js"></script>
  </body>
</html>
